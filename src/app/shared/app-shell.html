<div class="app-frame">
  <header class="topbar">
    <a class="brand" routerLink="/dashboard" (click)="closeMenu()">
      <span class="brand-mark"><img src="favicon.svg" alt="ArtikelBuddy" /></span>
    </a>
    <button class="menu-toggle" type="button" (click)="toggleMenu()" aria-label="Ouvrir le menu">☰</button>
    <nav class="main-nav" [class.is-open]="menuOpen">
      <span class="nav-label">Mission control</span>
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"><span>01</span>Accueil</a>
      <a routerLink="/rush" routerLinkActive="active" (click)="closeMenu()"><span>02</span>Rush</a>
      <a routerLink="/words" routerLinkActive="active" (click)="closeMenu()"><span>03</span>Révision</a>
      <div class="nav-account">
        <span class="avatar">{{ (auth.currentUser()?.pseudo ?? 'U').slice(0, 1).toUpperCase() }}</span>
        <span class="account-name">{{ auth.currentUser()?.pseudo }}</span>
        <button type="button" class="logout-button" (click)="logout()">Quitter</button>
      </div>
    </nav>
  </header>
  <main class="page-content"><router-outlet /></main>
</div>
